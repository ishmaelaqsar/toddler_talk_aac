name: Toddler Talk CI/CD

on:
  # Run tests on every push to master
  push:
    branches: [ "master" ]

  # Manual button click for Release
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

# Permission needed to upload the APK to the Releases page
permissions:
  contents: write

# Pinned, because a floating channel lets a new Flutter release fail the checks
# with no change to the code. Raise it on purpose.
env:
  FLUTTER_VERSION: '3.50.1'
  # The lint step of the Android Gradle plugin 9 calls an API that Java 21
  # added. On Java 17 the release build fails in lintVitalAnalyzeRelease.
  JAVA_VERSION: '21'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # The release job runs only by hand. Without this step, a broken Android
      # build shows first at release time.
      - name: Build APK (not published)
        run: flutter build apk --release

  build-release:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ToddlerTalk-${{ inputs.version }}.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          artifacts: "build/app/outputs/flutter-apk/ToddlerTalk-${{ inputs.version }}.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
